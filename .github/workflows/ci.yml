name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ekp
          POSTGRES_PASSWORD: ekp_secret
          POSTGRES_DB: ekp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekp -d ekp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-at-least-16-chars
      DATABASE_URL: postgresql+psycopg://ekp:ekp_secret@localhost:5432/ekp
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
      RATE_LIMIT_ENABLED: "false"
      LOG_FORMAT: text

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: MyPy type check
        run: mypy app

      - name: Validate Alembic migration chain
        run: |
          set -euo pipefail
          heads="$(alembic heads)"
          echo "$heads"
          head_count="$(printf '%s\n' "$heads" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$head_count" != "1" ]]; then
            echo "Expected a single Alembic head, found ${head_count}"
            exit 1
          fi
          alembic upgrade head
          alembic current

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t ekp-api:ci ./backend

      - name: Build frontend image
        run: docker build -t ekp-frontend:ci --target production ./frontend
